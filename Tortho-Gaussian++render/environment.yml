# Run from this directory: conda env create -f environment.yml
# Then: conda activate tortho-render && bash install.sh
# Includes the import dependencies of local PerspectiveFields inference.
# CUDA extensions are built separately, after PyTorch is installed.
name: TGPP-render
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.8.20
  - pip=24.3.1
  - setuptools=69.5.1
  - wheel
  - ninja
  - pytorch::pytorch=2.0.1=py3.8_cuda11.8_cudnn8.7.0_0
  - pytorch::torchvision=0.15.2=py38_cu118
  - pytorch-cuda=11.8
  - numpy=1.24.4
  - pillow=10.4.0
  - plyfile=0.8.1
  - tqdm=4.67.1
  - pip:
      - opencv-python-headless==4.10.0.84
      - matplotlib==3.7.5
      - scipy==1.10.1
      - scikit-learn==1.3.2
      - imageio==2.34.2
      - pyequilib==0.3.0
      - omegaconf==2.3.0
      - yacs==0.1.8
      - timm==1.0.27
